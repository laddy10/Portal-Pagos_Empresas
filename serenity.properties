############################
# SERENITY CONFIGURATION
############################

serenity.project.name = Portal_Pagos_Empresas
serenity.report.encoding = utf8
serenity.reports.show.step.details = true
serenity.store.html.source = true
serenity.timeout = 8000
serenity.resized.image.width = 600
serenity.compress.screenshots = true
serenity.logging = VERBOSE
serenity.browser.maximized = true
serenity.console.colors = true
serenity.take.screenshots = AFTER_EACH_STEP
serenity.outputDirectory = target/site/serenity
serenity.verbose.steps = true
serenity.report.show.manual.tests = true

############################
# WEBDRIVER CONFIGURATION
############################

# Chrome con perfil persistente (no temporal/incognito) para conservar la sesion de reCAPTCHA.
# Ver src/main/java/drivers/ChromePerfilPersistente.java
webdriver.driver = provided
webdriver.provided.type = chromepersistente
webdriver.provided.chromepersistente = drivers.ChromePerfilPersistente
webdriver.timeouts.implicitlywait = 3000
webdriver.wait.for.timeout = 3000
chrome.switches = --disable-gpu;--no-sandbox;--disable-dev-shm-usage;--window-size=1920,1080

############################
# FEATURES CONFIGURATION
############################

feature.file.language = es
feature.file.encoding = utf8
